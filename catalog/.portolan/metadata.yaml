# .portolan/metadata.yaml: catalog root. Collections inherit the fields below
# unless their own metadata.yaml overrides them.

title: "Global Drought Hazard"
description: >-
  A mirror of the [Global Drought Hazard](https://data.humdata.org/dataset/global-drought-hazard)
  rasters that the Institute for International Law of Peace and Armed Conflict
  (IFHV), Ruhr University Bochum, publishes on the Humanitarian Data Exchange.
  The rasters give extreme value return levels of the 6-month Standardised
  Precipitation Evapotranspiration Index (SPEI-6), 1902 to 2018, for five SPEI
  thresholds and six return periods (25 to 1000 years). The catalog holds the
  30 rasters as cloud-optimized GeoTIFFs. Read [AGENTS.md](AGENTS.md) before
  you query.

