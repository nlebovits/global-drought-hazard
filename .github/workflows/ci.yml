name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6

      # Separate tools: portolan-cli 0.9.0 requires rashid<0.4.0.
      - name: Install the validators
        run: |
          python -m pip install -r requirements-ci.txt
          uv tool install rashid==0.4.0
          uv tool install portolan-cli==0.9.0

      - name: Lint the tooling
        run: pyflakes tools/*.py tests/*.py

      - name: Validate metadata.yaml
        working-directory: catalog
        run: portolan metadata validate

      # Data never enters git, so rashid checks the STAC JSON, links, and
      # documents without the data pass. The weekly live job reads the data.
      - name: rashid
        run: rashid check catalog --no-data
